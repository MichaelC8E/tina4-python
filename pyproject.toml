[project]
name = "tina4-python"
version = "3.13.94"
description = "Tina4 Python v3 — Zero-dependency, lightweight web framework"
authors = [
    {name = "Andre van Zuydam", email = "andrevanzuydam@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

# ZERO core dependencies — this is v3's defining feature
dependencies = []

[project.optional-dependencies]
# Database drivers — install what you need
postgres = ["psycopg2-binary>=2.9"]
mysql = ["mysql-connector-python>=9.0"]
mssql = ["pymssql>=2.3"]
firebird = ["firebird-driver>=1.10"]
mongo = ["pymongo>=4.0"]
odbc = ["pyodbc>=5.0"]

# Session backends — install what you need
redis = ["redis>=5.0"]
memcache = ["pymemcache>=4.0"]

# Realtime file storage — the S3Storage backend is opt-in and needs boto3.
# tina4_python/realtime/storage.py imports it lazily inside S3Storage.__init__
# precisely so core stays zero-dependency; this extra is how an app that sets
# TINA4_STORAGE_BACKEND=s3 asks for the driver.
s3 = ["boto3>=1.34"]

# Queue backends — install what you need
kafka = ["confluent-kafka>=2.0"]
rabbitmq = ["pika>=1.3"]

# All database drivers
all-db = [
    "psycopg2-binary>=2.9",
    "mysql-connector-python>=9.0",
    "pymssql>=2.3",
    "firebird-driver>=1.10",
    "pymongo>=4.0",
    "pyodbc>=5.0",
]

# Every client the TEST SUITE needs against live services.
#
# These were installed ad hoc by CI (`uv pip install pymongo confluent-kafka
# pika ...`) and declared nowhere, so a fresh host had no way to know what the
# suite requires. confluent-kafka and pika in particular were in NO extra: the
# lab host's first full-suite run failed with three "confluent-kafka not
# installed" errors, correctly raised by the TINA4_REQUIRE_SERVICES gate, and
# `uv sync --all-extras` could not have fixed it because the dependency was not
# expressed anywhere. One declared extra means `uv sync --extra test` is
# reproducible on any machine.
#
# Includes firebird-driver even though the Firebird CI job installs it on its
# own: `uv sync --extra X` PRUNES anything outside the named extras, so a test
# extra that omitted it would silently uninstall it on a host that had it.
#
# boto3 is here for exactly that reason, one dependency later. The two
# S3Storage tests in tests/test_realtime_files.py gate on `import boto3`, boto3
# was declared in NO extra, and every `uv sync --extra test` therefore pruned it
# back out of the project venv even on a host where someone had installed it by
# hand. MinIO was up and reachable the whole time; the tests had simply never
# executed once. Same trap as firebird-driver above, and as the broker /
# MySQL / Postgres-port variables before that.
test = [
    "psycopg2-binary>=2.9",
    "mysql-connector-python>=9.0",
    "pymssql>=2.3",
    "firebird-driver>=1.10",
    "pymongo>=4.0",
    "pyodbc>=5.0",
    "redis>=5.0",
    "pymemcache>=4.0",
    "confluent-kafka>=2.0",
    "pika>=1.3",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "bottle>=0.13.4",
    "cython>=3.2.4",
    "django>=6.0.3",
    "fastapi>=0.135.1",
    "flask>=3.1.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "reportlab>=4.4.10",
    "ruff>=0.4",
    "setuptools>=82.0.1",
    "uvicorn>=0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["tina4_python/**/*"]

[project.scripts]
tina4python = "tina4_python.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: a test that needs real wall-clock time to reproduce a timing bug (deselect with -m 'not slow')",
]

[tool.ruff]
target-version = "py312"
line-length = 120
